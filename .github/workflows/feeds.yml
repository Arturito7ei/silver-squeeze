name: market-feeds

on:
  schedule:
    # Weekdays 16:00 UTC — after US morning data releases
    - cron: '0 16 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  # Needed so a successful data push can workflow_dispatch github-pages.
  # Default GITHUB_TOKEN pushes do not fire `on: push` workflows (GitHub recursion guard).
  actions: write

concurrency:
  group: market-feeds
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pull Vault Report metals + EIA + FRED and update data log
        run: node scripts/ingest-feeds.mjs

      - name: Commit public/data only
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/
          if git diff --staged --quiet; then
            echo "No data changes"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(data): ingest Vault Report metals + EIA/FRED"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # GITHUB_TOKEN commits never trigger github-pages' `on: push` (see permissions note).
      # Explicit workflow_dispatch keeps weekday cron unattended end-to-end (#14).
      - name: Trigger github-pages deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run github-pages.yml --ref "${{ github.ref_name }}"
